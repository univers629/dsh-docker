      </button>
    </div>
  </header>

  <!-- 品牌说明在左，登录窗体靠右，共用同一整页背景 -->

        <span class="hero__word">DeepSeek <em>Harness</em></span>

    <section class="auth-card" aria-label="登录">
      <div class="auth-card__heading">
        <span class="auth-card__icon">
          <svg class="mark" viewBox="0 0 24 24" fill="#4d6bfe" aria-hidden="true"><path d="M23.748 4.482c-.254-.124-.364.113-.512.234-.051.039-.094.09-.137.136-.372.397-.806.657-1.373.626-.829-.046-1.537.214-2.163.848-.133-.782-.575-1.248-1.247-1.548-.352-.156-.708-.311-.955-.65-.172-.241-.219-.51-.305-.774-.055-.16-.11-.323-.293-.35-.2-.031-.278.136-.356.276-.313.572-.434 1.202-.422 1.84.027 1.436.633 2.58 1.838 3.393.137.093.172.187.129.323-.082.28-.18.552-.266.833-.055.179-.137.217-.329.14a5.526 5.526 0 01-1.736-1.18c-.857-.828-1.631-1.742-2.597-2.458a11.365 11.365 0 00-.689-.471c-.985-.957.13-1.743.388-1.836.27-.098.093-.432-.779-.428-.872.004-1.67.295-2.687.684a3.055 3.055 0 01-.465.137 9.597 9.597 0 00-2.883-.102c-1.885.21-3.39 1.102-4.497 2.623C.082 8.606-.231 10.684.152 12.85c.403 2.284 1.569 4.175 3.36 5.653 1.858 1.533 3.997 2.284 6.438 2.14 1.482-.085 3.133-.284 4.994-1.86.47.234.962.327 1.78.397.63.059 1.236-.03 1.705-.128.735-.156.684-.837.419-.961-2.155-1.004-1.682-.595-2.113-.926 1.096-1.296 2.746-2.642 3.392-7.003.05-.347.007-.565 0-.845-.004-.17.035-.237.23-.256a4.173 4.173 0 001.545-.475c1.396-.763 1.96-2.015 2.093-3.517.02-.23-.004-.467-.247-.588zM11.581 18c-2.089-1.642-3.102-2.183-3.52-2.16-.392.024-.321.471-.235.763.09.288.207.486.371.739.114.167.192.416-.113.603-.673.416-1.842-.14-1.897-.167-1.361-.802-2.5-1.86-3.301-3.307-.774-1.393-1.224-2.887-1.298-4.482-.02-.386.093-.522.477-.592a4.696 4.696 0 011.529-.039c2.132.312 3.946 1.265 5.468 2.774.868.86 1.525 1.887 2.202 2.891.72 1.066 1.494 2.082 2.48 2.914.348.292.625.514.891.677-.802.09-2.14.11-3.054-.614zm1-6.44a.306.306 0 01.415-.287.302.302 0 01.2.288.306.306 0 01-.31.307.303.303 0 01-.304-.308zm3.11 1.596c-.2.081-.399.151-.59.16a1.245 1.245 0 01-.798-.254c-.274-.23-.47-.358-.552-.758a1.73 1.73 0 01.016-.588c.07-.327-.008-.537-.239-.727-.187-.156-.426-.199-.688-.199a.559.559 0 01-.254-.078c-.11-.054-.2-.19-.114-.358.028-.054.16-.186.192-.21.356-.202.767-.136 1.146.016.352.144.618.408 1.001.782.391.451.462.576.685.914.176.265.336.537.445.848.067.195-.019.354-.25.452z"/></svg>
        </span>
        <div>
          <h2 data-i18n="card.title">登录 DeepSeek Harness</h2>
          <small data-i18n="card.subtitle">进入你的 Agent 工作台</small>
        </div>
      </div>

      <div class="inline-alert inline-alert--danger" id="alert-error" role="alert"></div>

      <form class="form-stack" id="step-credentials">
        <label class="field">
          <span class="label" data-i18n="form.username">用户名</span>
          <span class="input-wrap">
            <input id="username" autocomplete="username" autofocus required spellcheck="false" />
          </span>
        </label>
        <label class="field">
          <span class="label" data-i18n="form.password">密码</span>
          <span class="input-wrap">
            <input id="password" type="password" autocomplete="current-password" required />
            <button class="input-action" id="toggle-password" type="button" aria-label="显示/隐藏密码">
              <svg id="eye-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="m2 2 20 20"/></svg>
            </button>
          </span>
        </label>

        <div class="captcha-slot" id="captcha-login" style="display:none"></div>

        <button class="button button--primary" id="submit-login" type="submit">
          <span data-i18n="form.secureLogin">安全登录</span>
        </button>

        <button class="button button--secondary" id="switch-passkey" type="button">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="3"/><circle cx="12" cy="12" r="3"/></svg>
          <span data-i18n="passkey.login">使用通行密钥</span>
        </button>

        <div class="auth-actions" id="register-link-wrap" style="display:none">
          <span class="muted-text" data-i18n="register.noAccount">还没有账户？</span>
          <button class="button--link" type="button" id="show-register" data-i18n="register.action">创建账户</button>
        </div>
      </form>

      <form class="form-stack" id="step-register" style="display:none">
        <div class="inline-alert inline-alert--info is-visible" data-i18n="register.hint"></div>
        <label class="field">
          <span class="label" data-i18n="form.username">用户名</span>
          <span class="input-wrap">
            <input id="register-username" autocomplete="username" spellcheck="false" />
          </span>
        </label>
        <label class="field">
          <span class="label" data-i18n="form.password">密码</span>
          <span class="input-wrap">
            <input id="register-password" type="password" autocomplete="new-password" />
          </span>
        </label>
        <!-- 强度提醒：只是提醒，不阻止提交。文案随输入实时变化，见 passwordAdvice。 -->
        <div class="inline-alert inline-alert--info" id="password-advice" role="status" style="display:none"></div>
        <label class="field">
          <span class="label" data-i18n="register.confirm">确认密码</span>
          <span class="input-wrap">
            <input id="register-confirm" type="password" autocomplete="new-password" />
          </span>
        </label>
        <label class="field" id="invite-field" style="display:none">
          <span class="label" data-i18n="register.invite">邀请码</span>
          <span class="input-wrap">
            <input id="register-invite" autocomplete="off" spellcheck="false" />
          </span>
        </label>
        <div class="captcha-slot" id="captcha-register" style="display:none"></div>

        <button class="button button--primary" id="submit-register" type="submit">
          <span data-i18n="register.submit">创建账户</span>
        </button>
        <div class="auth-actions">
          <button class="button--link" type="button" id="back-login" data-i18n="common.back">返回</button>
        </div>
      </form>

      <div class="form-stack" id="step-waking" style="display:none">
        <div class="waking">
          <span class="spinner"></span>
          <div>
            <strong data-i18n="waking.title">正在准备工作台</strong>
            <small data-i18n="waking.hint">首次使用需要初始化你的独立环境，通常 10–30 秒。</small>
          </div>
        </div>
        <div class="inline-alert inline-alert--info is-visible" id="waking-detail" role="status"></div>
        <button class="button button--secondary" id="waking-retry" type="button" style="display:none">
          <span data-i18n="waking.retry">重试</span>
        </button>
      </div>

      <form class="form-stack" id="step-totp" style="display:none">
        <div class="inline-alert inline-alert--info is-visible" role="status" data-i18n="totp.hint"></div>
        <label class="field">
          <span class="label" data-i18n="totp.title">两步验证</span>
          <span class="input-wrap">
            <input id="totp-code" class="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······" />
          </span>
        </label>
        <button class="button button--primary" id="submit-totp" type="submit">
          <span data-i18n="totp.verify">验证并进入</span>
        </button>
        <div class="auth-actions">
          <button class="button--link" type="button" id="use-recovery" data-i18n="totp.useRecovery">使用恢复码</button>
          <button class="button--link" type="button" id="back-credentials" data-i18n="common.back">返回</button>
        </div>
      </form>

      <div class="form-stack" id="step-passkey" style="display:none">
        <div class="inline-alert inline-alert--info is-visible" role="status" data-i18n="passkey.intro"></div>
        <button class="button button--primary" id="submit-passkey" type="button">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="3"/><circle cx="12" cy="12" r="3"/></svg>
          <span data-i18n="passkey.begin">开始通行密钥登录</span>
        </button>
        <button class="button button--secondary" id="back-password" type="button" data-i18n="passkey.usePassword">改用密码</button>
      </div>

      <div class="form-stack" id="step-choose" style="display:none">
        <div class="inline-alert inline-alert--info is-visible" id="choose-hint" role="status"></div>
        <button class="button button--primary" id="choose-workspace" type="button">
          <span data-i18n="choose.workspace">进入工作台</span>
        </button>
        <button class="button button--secondary" id="choose-admin" type="button">
          <span data-i18n="choose.admin">管理面板</span>
        </button>
      </div>

      <div class="form-stack" id="step-signedin" style="display:none">
        <div class="inline-alert inline-alert--info is-visible" id="signedin-hint" role="status"></div>
        <button class="button button--primary" id="go-workspace" type="button">
          <span data-i18n="signedIn.workspace">进入工作台</span>
        </button>
        <button class="button button--secondary" id="go-admin" type="button" style="display:none">
          <span data-i18n="signedIn.admin">管理面板</span>
        </button>
        <div class="auth-actions">
          <button class="button--link" type="button" id="do-logout" data-i18n="signedIn.logout">退出登录</button>
        </div>
      </div>

      <p class="auth-card__security">
        <span class="auth-card__security-note">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg>
          <span data-i18n="form.security">支持通行密钥与两步验证（TOTP）</span>
        </span>
      </p>
    </section>
  </main>

  <footer class="foot">
    <span data-i18n="brand.product">DeepSeek Harness · 自托管 Agent 环境</span>
    <a class="gh-link" href="https://github.com/deepseek-ai/deepseek-harness" target="_blank" rel="noopener noreferrer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.73.5.5 5.74.5 12.02c0 5.1 3.29 9.42 7.86 10.95.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.17.08 1.78 1.2 1.78 1.2 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.43-2.69 5.41-5.25 5.69.41.36.78 1.06.78 2.14 0 1.55-.01 2.8-.01 3.18 0 .31.21.68.8.56A11.52 11.52 0 0 0 23.5 12.02C23.5 5.74 18.27.5 12 .5Z"/></svg>
      <span>github.com/deepseek-ai/deepseek-harness</span>
    </a>
  </footer>
</div>

  // ---- 通行密钥的客户端搬运 ----
  // WebAuthn 的实现就是浏览器本身，这里只做 base64url ⇄ ArrayBuffer 的编解码与调用，
  // 不引入客户端库（与 KPanel web/src/lib/passkeys.ts 同构）。
  function decodeBase64URL(value) {
    const binary = atob(String(value).replace(/-/g, '+').replace(/_/g, '/'))
    const bytes = new Uint8Array(binary.length)
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i)
    return bytes.buffer
  }

  function encodeBase64URL(buffer) {
    const bytes = new Uint8Array(buffer)
    let binary = ''
    for (const byte of bytes) binary += String.fromCharCode(byte)
    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
  }

  function passkeySupported() {
    return Boolean(window.isSecureContext && window.PublicKeyCredential && navigator.credentials)
  }

  function parseCreationOptions(options) {
    return {
      ...options,
      challenge: decodeBase64URL(options.challenge),
      user: { ...options.user, id: decodeBase64URL(options.user.id) },
      excludeCredentials: (options.excludeCredentials || []).map((item) => ({ ...item, id: decodeBase64URL(item.id) })),
    }
  }

  function parseRequestOptions(options) {
    return {
      ...options,
      challenge: decodeBase64URL(options.challenge),
      allowCredentials: (options.allowCredentials || []).map((item) => ({ ...item, id: decodeBase64URL(item.id) })),
    }
  }

  /** 把浏览器凭据对象序列化成服务端期望的 JSON 形态。 */
  function serializeCredential(credential) {
    if (!credential || credential.type !== 'public-key') throw new DOMException('no public key credential', 'NotAllowedError')
    const key = credential
    const response = key.response
    const out = {
      id: key.id,
      rawId: encodeBase64URL(key.rawId),
      type: key.type,
      clientExtensionResults: key.getClientExtensionResults ? key.getClientExtensionResults() : {},
      response: { clientDataJSON: encodeBase64URL(response.clientDataJSON) },
    }
    if ('attestationObject' in response) {
      out.response.attestationObject = encodeBase64URL(response.attestationObject)
      out.response.transports = (response.getTransports && response.getTransports()) || []
    } else {
      out.response.authenticatorData = encodeBase64URL(response.authenticatorData)
      out.response.signature = encodeBase64URL(response.signature)
      out.response.userHandle = response.userHandle ? encodeBase64URL(response.userHandle) : null
    }
    return out
  }

  function passkeyErrorMessage(error) {
    if (error && error.name === 'NotAllowedError') return t('passkey.cancelled')
    if (error && error.name === 'InvalidStateError') return t('passkey.duplicate')
    if (error && (error.name === 'SecurityError' || error.name === 'NotSupportedError')) return t('passkey.unsupported')
    return t('passkey.failed')
  }

  // ---- 实例唤醒等待 ----
  let wakeTimer = 0

  /**
   * 登录成功后按就绪状态决定去向。
   *   未就绪 → 唤醒等待页（自动轮询，就绪后自行进入）
   *   已就绪且账号有实例 → 直接进入工作台（或 ?redirect= 指定的位置）
   *   单用户模式（无实例）→ 停在已登录状态，给出工作台/管理面板入口
   */
  async function afterLogin(body) {
    const target = redirectTarget()
    if (body && body.ready === false) {
      showWaking()
      return
    }
    // 管理员管的是别人：登录后先问一句去哪儿，而不是替他决定。
    // 普通用户没有管理面板，直接进工作台。
    if (hasAdminPanel && body && body.user && body.user.role === 'root') {
      $('choose-hint').textContent = t('choose.hint').replace('{user}', body.user.username)
      showStep(stepChoose)
      return
    }
    if (body && body.instance) {
      window.location.assign(target || '/')
      return
    }
    // 单用户模式：没有按账户区分的实例，但入口后面就是工作台，直接进去
    if (hasWorkspace) {
      window.location.assign(target || '/')
      return
    }
    // 开发/独立运行：入口后面没有工作台，跳转会绕回登录页，只能停在已登录状态
    showSignedIn(body && body.user)
  }

  const WAKE_REDIRECT_MARK = 'dsh-waking-redirect-at'

  /**
   * 用浏览器真实路径探一次工作台是否真的能打开。
   *
   * 关键点：编排服务说的「就绪」和浏览器能打开不是同一件事。实例刚创建时，入口的
   * 内嵌 DNS 可能还没有这个容器名（解析结果有缓存），于是「就绪 → 跳转 → 502 →
   * 回等待页」会空转，把入口限速打爆成 429。所以这里跟着重定向走一遍，只有最终落在
   * 工作台（而不是 /login 或 /waking）才算真的能进。
   */
  async function workspaceReachable() {
    try {
      const probe = await fetch('/?__probe=1', { redirect: 'follow', cache: 'no-store', credentials: 'same-origin' })
      if (!probe.ok) return false
      const landing = new URL(probe.url)
      if (landing.pathname.startsWith('/login') || landing.pathname.startsWith('/waking')) return false
      // 设置页也由网关提供；落在这里说明仍被挡着
      if (landing.pathname.startsWith('/register')) return false
      return true
    } catch {
      return false
    }
  }

  function showWaking() {
    showStep(stepWaking)
    $('waking-detail').textContent = t('waking.starting')
    $('waking-retry').style.display = 'none'
    const started = Date.now()

    // 防空转：如果刚刚才因为「就绪」跳转过一次，说明跳过去又被退回来了。
    // 此时不再自动跳，交给用户点重试，避免把入口限速打爆。
    let attempts = 0
    try {
      const last = Number(sessionStorage.getItem(WAKE_REDIRECT_MARK) || 0)
      if (last && Date.now() - last < 20_000) attempts = 3
    } catch { /* 无存储时按首次处理 */ }

    clearInterval(wakeTimer)
    const tick = async () => {
      attempts += 1
      let serverReady = false
      try {
        const state = await api('/api/auth/instance', { method: 'GET' })
        serverReady = Boolean(state.response.ok && state.body && state.body.ready === true)
      } catch {
        /* 轮询失败继续重试 */
      }

      // 停手条件必须排在跳转之前：跳转分支一旦 return，后面的停手规则就永远走不到，
      // 「可达性一会儿真一会儿假」就会变成持续闪烁。
      if (attempts >= 3 && serverReady) {
        clearInterval(wakeTimer)
        $('waking-detail').textContent = t('waking.stuck')
        $('waking-retry').style.display = ''
        return
      }

      if (serverReady && await workspaceReachable()) {
        // 连续两次都通才跳：入口的 DNS 缓存与容器内 nginx 启动之间有一小段抖动，
        // 单次成功就跳会把用户送进「刚跳过去又被打回来」的循环。
        await new Promise((resolve) => setTimeout(resolve, 600))
        if (await workspaceReachable()) {
          clearInterval(wakeTimer)
          $('waking-detail').textContent = t('waking.ready')
          try { sessionStorage.setItem(WAKE_REDIRECT_MARK, String(Date.now())) } catch { /* 忽略 */ }
          window.location.replace(redirectTarget() || '/')
          return
        }
      }

      const seconds = Math.round((Date.now() - started) / 1000)
      $('waking-detail').textContent = serverReady
        ? t('waking.almost').replace('{n}', String(seconds))
        : t('waking.waiting').replace('{n}', String(seconds))

      if (Date.now() - started > 90_000) {
        clearInterval(wakeTimer)
        $('waking-detail').textContent = t('waking.timeout')
        $('waking-retry').style.display = ''
      }
    }
    wakeTimer = setInterval(tick, 3000)
    tick()
  }

  $('waking-retry').addEventListener('click', () => {
    try { sessionStorage.removeItem(WAKE_REDIRECT_MARK) } catch { /* 忽略 */ }
    showWaking()
  })

  // ---- 真实后端调用 ----
  async function api(path, options = {}) {
    const response = await fetch(path, {
      credentials: 'same-origin',
      headers: { 'content-type': 'application/json', ...(options.headers ?? {}) },
      cache: 'no-store',
      ...options,
    })
    let body = {}
    try { body = await response.json() } catch { body = {} }
    return { response, body }
  }

  let csrfToken = ''

  function errorText(body, response) {
    if (body && body.code === 'invalid_credentials') return t('error.invalidCredentials')
    if (body && body.code === 'rate_limited') {
      const seconds = Number(body.retryAfter) > 0 ? Number(body.retryAfter) : 900
      return t('error.rateLimited').replace('{n}', String(Math.ceil(seconds / 60)))
    }
    if (body && body.code === 'second_factor_required') return t('error.secondFactor')
    if (body && body.code === 'captcha_failed') return t('error.captchaFailed')
    if (body && body.code === 'captcha_unavailable') return t('error.captchaUnavailable')
    if (body && body.code === 'invalid_second_factor') return t('totp.codeWrong')
    if (body && body.code === 'second_factor_locked') {
      const seconds = Number(body.retryAfter) > 0 ? Number(body.retryAfter) : 60
      return t('error.rateLimited').replace('{n}', String(Math.max(1, Math.ceil(seconds / 60))))
    }
    // 入口自己的 429 是 HTML，解析不出 code：按状态码也要说清楚，否则用户只会看到
    // 「操作未完成」，既不知道被限速了、也不知道该等多久。
    if (response && response.status === 429) {
      const seconds = Number(response.headers.get('retry-after')) > 0 ? Number(response.headers.get('retry-after')) : 60
      return t('error.rateLimited').replace('{n}', String(Math.max(1, Math.ceil(seconds / 60))))
    }
    if (response && response.status === 401) return t('error.invalidCredentials')
    return t('error.generic')
  }

  let signedInUser = null
  let hasAdminPanel = false
  let hasWorkspace = false

  // ---------------------------------------------------------------- 人机验证
  //
  // 三家服务的协议一致（前端拿 token、服务端 siteverify 校验），差别只在脚本地址与
  // 渲染方式。这里按 /api/auth/status 返回的 provider 动态加载，未启用时整个容器不显示。
  const CAPTCHA = {
    config: { required: false, provider: '', siteKey: '' },
    tokens: { 'captcha-login': '', 'captcha-register': '' },
    loaded: new Set(),
  }

  const CAPTCHA_SCRIPTS = {
    turnstile: 'https://challenges.cloudflare.com/turnstile/v0/api.js',
    hcaptcha: 'https://js.hcaptcha.com/1/api.js',
    recaptcha: 'https://www.google.com/recaptcha/api.js',
  }
  const CAPTCHA_CLASSES = {
    turnstile: 'cf-turnstile',
    hcaptcha: 'h-captcha',
    recaptcha: 'g-recaptcha',
  }

  function loadScriptOnce(src) {
    if (CAPTCHA.loaded.has(src)) return Promise.resolve()
    return new Promise((resolve, reject) => {
      const script = document.createElement('script')
      script.src = src
      script.async = true
      script.defer = true
      script.addEventListener('load', () => { CAPTCHA.loaded.add(src); resolve() })
      script.addEventListener('error', () => reject(new Error('cannot load ' + src)))
      document.head.appendChild(script)
    })
  }

  /**
   * 在给定容器里渲染人机验证控件。
   *
   * 三家的隐式渲染都是「容器里放一个带 class 与 data-sitekey 的元素，脚本自己接管」，
   * 因此这里不调用各家各自的 render API，只放置元素——三个 provider 共用一条代码路径。
   */
  function renderCaptchaWidget(containerId) {
    const slot = $(containerId)
    if (!slot) return
    if (!CAPTCHA.config.required || !CAPTCHA.config.siteKey) {
      slot.style.display = 'none'
      slot.textContent = ''
      return
    }
    slot.style.display = ''
    slot.textContent = ''

    const hint = document.createElement('div')
    hint.className = 'captcha-slot__hint'
    hint.textContent = t('captcha.hint')
    slot.appendChild(hint)

    const host = document.createElement('div')
    slot.appendChild(host)

    const provider = CAPTCHA.config.provider
    const script = CAPTCHA_SCRIPTS[provider]
    const className = CAPTCHA_CLASSES[provider]
    if (!script || !className) return

    const suffix = containerId.replace(/-/g, '_')
    const onToken = '__dshCaptcha_' + suffix
    const onExpired = '__dshCaptchaExpired_' + suffix

    const widget = document.createElement('div')
    widget.className = className
    widget.setAttribute('data-sitekey', CAPTCHA.config.siteKey)
    // 三家都用 data-callback 指定拿到 token 的回调
    widget.setAttribute('data-callback', onToken)
    widget.setAttribute('data-expired-callback', onExpired)
    host.appendChild(widget)

    // 回调必须挂在 window 上：脚本是按名字从全局作用域里找它们的
    window[onToken] = (token) => { CAPTCHA.tokens[containerId] = token }
    window[onExpired] = () => { CAPTCHA.tokens[containerId] = '' }

    loadScriptOnce(script).catch(() => {
      hint.textContent = t('captcha.loadFailed')
      hint.style.color = '#ff8f8f'
    })
  }

  function renderCaptchaWidgets() {
    renderCaptchaWidget('captcha-login')
    renderCaptchaWidget('captcha-register')
  }

  /**
   * 取走当前容器的 token，并立刻作废它。
   *
   * Turnstile 的 token 是一次性的：服务端拿它去 Cloudflare 校验一次，之后无论
   * 那次请求成功与否都作废。前端若把同一个 token 再送一次，Cloudflare 回
   * invalid-input-response —— 界面只显示一句笼统的「操作未完成」，看不出原因。
   * 所以取用即消费，并让调用方在需要时重挂 widget 拿一个新的。
   */
  function captchaTokenFor(containerId) {
    if (!CAPTCHA.config.required) return ''
    const token = CAPTCHA.tokens[containerId] || ''
    CAPTCHA.tokens[containerId] = ''
    return token
  }

  /**
   * 重挂某个容器的人机验证 widget，拿一枚新 token。
   *
   * 提交失败后必须调用它：失败的那次已经把那枚 token 用掉了，不重挂的话用户
   * 再点一次提交仍然带着作废的 token，于是永远失败。
   */
  function refreshCaptchaWidget(containerId) {
    if (!CAPTCHA.config.required) return
    CAPTCHA.tokens[containerId] = ''
    renderCaptchaWidget(containerId)
  }



  // 自动跳转的防抖：10 秒内只跳一次。第二次回到本页说明入口侧与网关侧判定不一致，
  // 再跳就是死循环（用户看到的是页面不停闪烁）。
  const REDIRECT_MARK = 'dsh-login-redirect-at'
  function justBounced() {
    try {
      const last = Number(sessionStorage.getItem(REDIRECT_MARK) || 0)
      return Boolean(last) && Date.now() - last < 10_000
    } catch {
      return false
    }
  }
  function markRedirect() {
    try { sessionStorage.setItem(REDIRECT_MARK, String(Date.now())) } catch { /* 忽略 */ }
  }

  function showSignedIn(user, target) {
    signedInUser = user ?? null
    showStep(stepSignedIn)
    // 有目标地址时，兜底按钮直接去那里（而不是永远回根路径）
    $('go-workspace').dataset.target = target || ''
    $('signedin-hint').textContent = t('signedIn.hint').replace('{user}', user && user.username ? user.username : '')
    // 管理面板只在多用户模式且身份为管理员时出现
    $('go-admin').style.display = hasAdminPanel && user && user.role === 'root' ? '' : 'none'
    // 单用户模式没有工作台之外的入口，登录成功后应当已经进去了；这里只作为兜底
    $('go-workspace').style.display = hasWorkspace ? '' : 'none'
  }

  $('choose-workspace').addEventListener('click', () => window.location.assign(redirectTarget() || '/'))
  $('choose-admin').addEventListener('click', () => window.location.assign('/admin'))
  $('go-workspace').addEventListener('click', (event) => {
    // 用户手动确认时清掉防抖标记：这是他的明确意图，不该被上一次的自动跳转影响
    try { sessionStorage.removeItem(REDIRECT_MARK) } catch { /* 忽略 */ }
    window.location.assign(event.currentTarget.dataset.target || redirectTarget() || '/')
  })
  $('go-admin').addEventListener('click', () => window.location.assign('/admin'))

  /**
   * 登录后的去向。只接受解析后仍停留在本站的路径：解析失败、跨站、含控制字符
   * 或反斜杠一律拒绝，没有 redirect 参数时返回空串。
   *
   * 不能用字符串前缀判断（如 `startsWith('//')`）：浏览器把 `\` 当作 `/`，
   * `/\evil.com` 能绕过前缀检查再被解析到 `https://evil.com/`；制表符、LF、CR
   * 同理（审计实测 %5C/%09/%0A/%0D 四种形式都能离开站点）。改为先 new URL()
   * 归一化、再比较 origin，归一化发生在比较之前，整类绕过就一起消失了。
   */
  function redirectTarget() {
    const raw = new URLSearchParams(window.location.search).get('redirect')
    if (!raw) return ''
    // 先拦控制字符与反斜杠：URL 解析器会吞掉制表符/换行，拦在前面语义更清楚
    if (/[\u0000-\u001f\u007f]/.test(raw) || raw.includes('\\')) return ''
    if (!raw.startsWith('/')) return ''
    if (raw.startsWith('/login')) return ''
    try {
      const resolved = new URL(raw, window.location.origin)
      if (resolved.origin !== window.location.origin) return ''
      // 只取归一化后的 path + search + hash，不携带用户名/密码等成分
      return resolved.pathname + resolved.search + resolved.hash
    } catch {
      return ''
    }
  }

  function registerErrorText(body) {
    const code = body && body.code
    if (code === 'invalid_username') return t('register.errorUsername')
    if (code === 'weak_password') return t('register.errorWeak')
    if (code === 'username_taken') return t('register.errorTaken')
    if (code === 'invalid_invite') return t('register.errorInvite')
    // 管理员关了注册：用户手里的邀请码可能完全正确，必须给出不同的提示，
    // 否则他们会反复检查邀请码而不是去问管理员。
    if (code === 'registration_closed') return t('register.errorClosed')
    if (code === 'rate_limited') return t('register.errorRateLimited')
    return t('error.generic')
  }

  // 进入页面即探测：已登录时停在「已登录」状态，绝不自动跳回 `/`——`/` 在本地直连时
  // 会 302 回 /login，自动跳转会让浏览器陷入无限重定向（表现为页面狂闪）。
  ;(async () => {
    try {
      const status = await api('/api/auth/status')
      const capabilities = status.body || {}
      // 管理面只在多用户模式存在：一个人用的部署登录后直接进工作台，不该出现用户管理入口
      hasAdminPanel = capabilities.adminPanel === true
      hasWorkspace = capabilities.workspace === true
      // 服务端说需要人机验证时才渲染控件；siteKey 是公开值，随 status 一起下发
      CAPTCHA.config = {
        required: capabilities.captcha?.required === true,
        provider: capabilities.captcha?.provider ?? '',
        siteKey: capabilities.captcha?.siteKey ?? '',
      }
      renderCaptchaWidgets()
      // 通行密钥需要安全上下文，否则隐藏入口而不是让用户点了必然失败
      if (!capabilities.passkeyAvailable || !passkeySupported()) {
        const button = $('switch-passkey')
        if (button) button.style.display = 'none'
      }
      // 注册入口：多用户模式且管理员开放了注册才出现。
      // 邀请码字段只在本部署要求凭码注册时出现（两个开关互相独立）。
      if (capabilities.multiUser === true && capabilities.registrationOpen !== false) {
        $('register-link-wrap').style.display = ''
        if (capabilities.inviteRequired === true) $('invite-field').style.display = ''
      }
      const session = await api('/api/auth/session')
      if (session.response.ok) {
        const target = redirectTarget()
        if (target && !justBounced()) {
          markRedirect()
          window.location.replace(target)
        } else {
          // 刚跳过又被退回来：说明入口那一侧的判定与这里不一致，
          // 继续自动跳只会变成无限闪烁。改为把决定权交回用户。
          if (target) info(t('notice.loopStopped'))
          showSignedIn(session.body.user, target)
        }
      }
    } catch {
      /* 探测失败不影响手动登录 */
    }
  })()

  $('do-logout').addEventListener('click', async () => {
    try {
      await api('/api/auth/logout', { method: 'POST', body: '{}' })
    } catch {
      /* 即使请求失败也回到登录表单 */
    }
    window.location.replace('/login')
  })

  $('step-credentials').addEventListener('submit', async (e) => {
    e.preventDefault(); clearError()
    const u = $('username').value.trim()
    const p = $('password').value
    if (!u || !p) { error(t('form.errorRequired')); return }
    const captchaToken = captchaTokenFor('captcha-login')
    // 服务端要求验证而控件还没给出 token 时本地就提示，省一次必然失败的请求
    if (CAPTCHA.config.required && !captchaToken) { error(t('captcha.required')); return }
    const btn = $('submit-login')
    busy(btn, true)
    try {
      const { response, body } = await api('/api/auth/login', {
        method: 'POST',
        body: JSON.stringify({ username: u, password: p, captchaToken }),
      })
      if (response.ok) {
        csrfToken = body.csrfToken || ''
        // 需要第二因子时进入验证码步骤，会话尚未建立
        if (body.secondFactor && body.secondFactor.challenge) {
          pendingChallenge = body.secondFactor.challenge
          busy(btn, false)
          showStep(stepTotp)
          $('totp-code').focus()
          return
        }
        if (body.csrfToken) { await afterLogin(body); return }
        busy(btn, false)
        return
      }
      busy(btn, false)
      error(errorText(body, response))
      // 这枚 token 已经被服务端用掉了，重挂 widget 才能再试一次。
      refreshCaptchaWidget('captcha-login')
    } catch {
      busy(btn, false)
      error(t('error.network'))
      refreshCaptchaWidget('captcha-login')
    }
  })

  // ---- 两步验证 ----
  let pendingChallenge = ''
  let recoveryMode = false

  $('totp-code').addEventListener('input', (e) => {
    if (recoveryMode) return
    e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 6)
  })

  $('use-recovery').addEventListener('click', () => {
    recoveryMode = true
    const input = $('totp-code')
    input.classList.remove('otp')
    input.value = ''
    input.placeholder = 'XXXXX-XXXXX-XXXXX'
    input.setAttribute('maxlength', '20')
    $('use-recovery').style.display = 'none'
    input.focus()
  })

  $('back-credentials').addEventListener('click', () => {
    clearError(); pendingChallenge = ''; recoveryMode = false
    showStep(stepCredentials)
  })

  $('step-totp').addEventListener('submit', async (e) => {
    e.preventDefault()
    clearError()
    const code = $('totp-code').value.trim()
    if (!code) { error(t('totp.hint')); return }
    const btn = $('submit-totp')
    busy(btn, true)
    try {
      const { response, body } = await api('/api/auth/login/totp', {
        method: 'POST',
        body: JSON.stringify({ challenge: pendingChallenge, code }),
      })
      busy(btn, false)
      if (response.ok) {
        csrfToken = body.csrfToken || ''
        await afterLogin(body)
        return
      }
      if (body && body.code === 'invalid_challenge') {
        // 挑战只能消费一次；重新回到密码步骤取新的挑战
        pendingChallenge = ''
        error(t('totp.expired'))
        showStep(stepCredentials)
        return
      }
      error(errorText(body, response))
    } catch {
      busy(btn, false)
      error(t('error.network'))
    }
  })

  // ---- 通行密钥登录 ----
  $('switch-passkey').addEventListener('click', () => { clearError(); showStep(stepPasskey) })
  $('back-password').addEventListener('click', () => { clearError(); showStep(stepCredentials) })

  $('submit-passkey').addEventListener('click', async () => {
    clearError()
    const btn = $('submit-passkey')
    busy(btn, true)
    try {
      const begin = await api('/api/auth/passkey/login/begin', {
        method: 'POST',
        body: JSON.stringify({ username: $('username').value.trim() }),
      })
      if (!begin.response.ok) {
        busy(btn, false)
        error(begin.body && begin.body.code === 'passkey_unavailable' ? t('passkey.unavailable') : t('error.generic'))
        return
      }
      const credential = await navigator.credentials.get({ publicKey: parseRequestOptions(begin.body.publicKey) })
      const finish = await api('/api/auth/passkey/login/finish', {
        method: 'POST',
        body: JSON.stringify({ challenge: begin.body.challenge, response: serializeCredential(credential) }),
      })
      busy(btn, false)
      if (!finish.response.ok) { error(errorText(finish.body)); return }
      if (finish.body.secondFactor && finish.body.secondFactor.challenge) {
        pendingChallenge = finish.body.secondFactor.challenge
        showStep(stepTotp)
        $('totp-code').focus()
        return
      }
      csrfToken = finish.body.csrfToken || ''
      await afterLogin(finish.body)
    } catch (error_) {
      busy(btn, false)
      error(passkeyErrorMessage(error_))
    }
  })

  // ---- 注册 ----
  $('show-register').addEventListener('click', () => { clearError(); showStep(stepRegister) })
  $('back-login').addEventListener('click', () => { clearError(); showStep(stepCredentials) })

  // 密码强度提醒：边输边提示，不阻止提交。服务端只硬性要求长度下限。
  $('register-password').addEventListener('input', (e) => {
    const node = $('password-advice')
    const value = e.target.value
    const bytes = new TextEncoder().encode(value).length
    // 低于下限时由提交后的错误提示说明，这里不重复。
    if (bytes < 6) { node.style.display = 'none'; node.textContent = ''; return }
    let hasLetter = false
    let hasDigit = false
    let hasSymbol = false
    for (const ch of value) {
      if ((ch >= 'a' && ch <= 'z') || (ch >= 'A' && ch <= 'Z')) hasLetter = true
      else if (ch >= '0' && ch <= '9') hasDigit = true
      else hasSymbol = true
    }
    const kinds = [hasLetter, hasDigit, hasSymbol].filter(Boolean).length
    const key = bytes < 12 && kinds < 2 ? 'password.advice.shortSimple'
      : bytes < 12 ? 'password.advice.short'
        : kinds < 2 ? 'password.advice.simple'
          : ''
    node.textContent = key ? t(key) : ''
    node.style.display = key ? '' : 'none'
  })

  $('step-register').addEventListener('submit', async (e) => {
    e.preventDefault()
    clearError()
    const username = $('register-username').value.trim()
    const password = $('register-password').value
    const confirm = $('register-confirm').value
    // 本地能判定的错误先判：captchaTokenFor 会取走 token（它是一次性的），
    // 在必填/一致性校验之前调用等于把一枚好 token 白白作废。
    if (!username || !password) { error(t('register.errorRequired')); return }
    if (password !== confirm) { error(t('register.errorMismatch')); return }
    const captchaToken = captchaTokenFor('captcha-register')
    if (CAPTCHA.config.required && !captchaToken) { error(t('captcha.required')); return }
    const btn = $('submit-register')
    busy(btn, true)
    try {
      const { response, body } = await api('/api/auth/register', {
        method: 'POST',
        body: JSON.stringify({ username, password, inviteCode: $('register-invite').value.trim(), captchaToken }),
      })
      busy(btn, false)
      if (response.ok) {
        // 注册成功不自动登录：回到登录步骤并提示，避免在未确认邮箱/未建 2FA 前就发会话
        $('username').value = username
        $('password').value = ''
        showStep(stepCredentials)
        info(t('register.created'))
        $('password').focus()
        return
      }
      error(registerErrorText(body))
      // 这枚 token 已经被服务端用掉了（无论失败原因是什么），重挂 widget 才能再试。
      // 不重挂的话用户改完用户名再点提交，带着的还是那枚作废的 token，必然再次失败。
      refreshCaptchaWidget('captcha-register')
    } catch {
      busy(btn, false)
      error(t('error.network'))
      refreshCaptchaWidget('captcha-register')
    }
  })

  // 两步验证与通行密钥在 M2 接入；在此之前对应步骤不渲染，避免出现「假可用」的界面。
  showStep(stepCredentials)

  // 进入 /register（或带 ?mode=register）直接展示注册步骤
  if (window.location.pathname.replace(/\/+$/, '') === '/register' || new URLSearchParams(window.location.search).get('mode') === 'register') {
    showStep(stepRegister)
  }

  // /waking：实例被闲置回收后用户回来，nginx 在这里把请求交给我们。主动触发唤醒，
  // 然后进入与首次登录相同的等待界面，就绪后回到用户原本要访问的地址。
  if (window.location.pathname.replace(/\/+$/, '') === '/waking') {
    ;(async () => {
      try {
        await api('/api/auth/instance/wake', { method: 'POST', body: '{}' })
      } catch {
        /* 唤醒请求失败时仍进入等待界面，由轮询继续尝试 */
      }
      // 只有「确定未登录」（401）才回登录页；限速、瞬时故障等不该把用户踢出流程，
      // 否则一次抖动就会让人反复跳转。并带上原因，让登录页说明发生了什么。
      const session = await api('/api/auth/session', { method: 'GET' })
      if (session.response.status === 401) {
        window.location.replace('/login?reason=session')
        return
      }
      showWaking()
    })()
  }


  // 从账户页被弹回来时说明原因：会话失效、改过密码、还是刚改了安全设置。
  // 没有这段的话，用户只会看到自己突然回到了登录页而不知道为什么。
  {
    const reason = new URLSearchParams(window.location.search).get('reason')
    const text = reason === 'session' ? t('notice.sessionExpired')
      : reason === 'password' ? t('notice.passwordChanged')
        : reason === 'security' ? t('notice.securityChanged')
          : ''
    if (text) info(text)
  }

  applyLang()
})()
</script>
</body>
</html>
