services:
  dsh:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${DSH_IMAGE:-dsh:local}"
    container_name: dsh
    hostname: dsh
    user: "0:0"
    restart: unless-stopped
    ports:
      # Keep the public entry behind the authenticated reverse proxy. Docker
      # must not publish the privileged loopback bridge on every interface.
      - "${DSH_BIND_HOST:-127.0.0.1}:3080:3080"
    networks:
      - default
      - dsh-private
    environment:
      DSH_HOME: /data/dsh
      DSH_AGENTS_HOME: /data/agents
      DSH_PERMISSION_MODE: "${DSH_PERMISSION_MODE:-danger-full-access}"
      DSH_HOST_ACCESS: "${DSH_HOST_ACCESS:-mounted-paths-only}"
      DSH_WRITABLE_PATHS: "${DSH_WRITABLE_PATHS:-/data/dsh,/data/home,/data/mcp,/data/agents,/workspace}"
      DSH_SYSTEM_PACKAGES_PERSISTENT: "true"
      DSH_SYSTEM_OS: "${DSH_SYSTEM_OS:-}"
      DSH_SYSTEM_RELEASE: "${DSH_SYSTEM_RELEASE:-}"
      DSH_SYSTEM_ARCH: "${DSH_SYSTEM_ARCH:-}"
      DSH_SYSTEM_PACKAGE_ARCH: "${DSH_SYSTEM_PACKAGE_ARCH:-}"
      DSH_SYSTEM_ABI: "${DSH_SYSTEM_ABI:-}"
      DSH_SYSTEM_LIBC: "${DSH_SYSTEM_LIBC:-}"
      DSH_ACCESS_MODE: "${DSH_ACCESS_MODE:-local}"
      DSH_WEB_PORT: "3081"
      DSH_TRUSTED_HOSTS: "${DSH_TRUSTED_HOSTS:-}"
      NODE_PATH: "/app/dsh/node_modules:/data/dsh/profiles/node_modules"
    volumes:
      - ./data/dsh:/data/dsh
      - ./data/agents:/data/agents
      - ./data/mcp:/data/mcp
      - ./data/home:/data/home
      - ./data/auth:/opt/dsh-auth:ro
      - ./workspace:/workspace
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Nginx 的 /healthz 是无条件 204，单探它无法发现 DSH 崩溃；DSH 自己的
      # 回环端口才是真正的存活信号。
      test: ["CMD", "node", "-e", "const dshPort = process.env.DSH_WEB_PORT || '3081';const check = (url) => fetch(url).then((response) => {if (!response.ok) throw new Error(url + ' ' + response.status)});Promise.all([check('http://127.0.0.1:3080/healthz'), check('http://127.0.0.1:' + dshPort + '/')]).then(() => process.exit(0)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  dsh-private:
    # Set DSH_DOCKER_NETWORK=dpanel-local and
    # DSH_DOCKER_NETWORK_EXTERNAL=true on a VPS where DPanel is attached to
    # that network. The default keeps local installs self-contained.
    name: "${DSH_DOCKER_NETWORK:-dsh-private}"
    external: ${DSH_DOCKER_NETWORK_EXTERNAL:-false}
