name: publish-image

# 在 GitHub 的原生 amd64 和 arm64 runner 上分别构建，再合并成一个多架构清单。
# DSH 本体是 npm 上的预构建包，所以构建的主要成本是 apt 和 npm 下载，不再编译。
on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: 要安装的 DSH npm 版本或 dist-tag（默认 latest）
        required: false
        default: latest
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 先把 dist-tag 解析成确定的版本号：镜像因此固定安装一个确切版本，标签里也能
  # 直接看出 DSH 版本。
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.pick.outputs.version }}
      build: ${{ steps.pick.outputs.build }}
    steps:
      - name: Resolve the DSH version
        id: pick
        env:
          REQUESTED: ${{ github.event.inputs.dsh_version || 'latest' }}
        run: |
          set -eu
          version="$(npm view "@deepseek-ai/dsh@${REQUESTED}" version)"
          case "$version" in '') echo 'npm 没有返回版本号。' >&2; exit 1 ;; esac
          echo "resolved DSH version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo 'build=true' >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            slug: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            slug: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 镜像解包后仍有 1 GB 级别，先腾出预装的 SDK 免得 runner 磁盘不够。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # push-by-digest 只推送单架构镜像，不占用 :latest 标签；合并作业负责打标签。
      # provenance 必须关闭，否则 imagetools 会把证明清单也当成一个平台。
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            DSH_VERSION=${{ needs.resolve.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Gate the built image in an offline container
        timeout-minutes: 10
        shell: bash
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
          PLATFORM_SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          [[ "$BUILD_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="${REGISTRY}/${IMAGE_NAME}@${BUILD_DIGEST}"
          container=''
          cleanup() {
            local result="$?"
            if [[ "$container" =~ ^[0-9a-f]{64}$ ]]; then
              if [ "$result" -ne 0 ]; then
                docker logs --tail 120 "$container" 2>&1 \
                  | sed -E 's/([?&]token=)[A-Za-z0-9_-]+/\1[redacted]/g' >&2 || true
              fi
              docker rm --force --volumes "$container" >/dev/null || result=1
            fi
            return "$result"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          docker pull "$image"
          container="$(docker create \
            --name "dsh-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${PLATFORM_SLUG}-${RANDOM}" \
            --network none \
            --mount type=tmpfs,dst=/data \
            --mount type=tmpfs,dst=/workspace \
            --env DSH_DEPLOYMENT_MODE=local --env DSH_WEB_PORT=3081 \
            "$image")"
          [[ "$container" =~ ^[0-9a-f]{64}$ ]]
          docker start "$container" >/dev/null

          # Exchange only this disposable process's printed launch token; never bypass core authentication.
          probe_js="$(cat <<'NODE'
          const startup = await new Promise((resolve, reject) => {
            let text = '';
            process.stdin.setEncoding('utf8');
            process.stdin.on('data', chunk => { text += chunk; });
            process.stdin.on('end', () => resolve(text));
            process.stdin.on('error', reject);
          });
          const origin = 'http://127.0.0.1:3081';
          const ensure = (ok, message) => { if (!ok) throw new Error(message); };
          const request = (url, options = {}) => fetch(url, { redirect: 'manual', signal: AbortSignal.timeout(1500), ...options });
          let phase = 'Nginx';
          try {
            ensure((await request('http://127.0.0.1:3080/healthz')).status === 204, 'Nginx must return 204');
            phase = 'core launch authorization';
            const announced = [...startup.matchAll(/^dsh web: (\S+)\r?$/gm)].at(-1)?.[1];
            ensure(announced, 'the core must announce its ready launch URL');
            const launch = new URL(announced);
            ensure(launch.origin === origin && launch.pathname === '/', 'the launch URL must use the fixed loopback core');
            ensure(launch.searchParams.getAll('token').length === 1 && [...launch.searchParams.keys()].length === 1, 'one process token is required');
            const exchange = await request(launch);
            ensure(exchange.status === 303 && exchange.headers.get('location') === './', 'normal launch-token exchange must succeed');
            const cookie = exchange.headers.getSetCookie()[0]?.split(';')[0];
            ensure(cookie && /^dsh-auth-[A-Za-z0-9_-]+=[A-Za-z0-9._-]+$/.test(cookie), 'the core must issue its signed session cookie');
            const options = { headers: { cookie } };
            phase = 'authenticated core index';
            const index = await request(`${origin}/`, options);
            ensure(index.status === 200 && /^text\/html\b/.test(index.headers.get('content-type') ?? ''), 'authenticated core HTML must return 200');
            const html = await index.text();
            const bootMatch = html.match(/globalThis\["__DSH_BOOT__"\]\s*=\s*([^<]+)<\/script>/);
            ensure(bootMatch, 'the core must inject its real boot graph');
            const boot = JSON.parse(bootMatch[1]);
            ensure(boot.release?.version === process.env.DSH_CI_VERSION, 'the boot graph must identify the built release');
            ensure(Array.isArray(boot.entries) && boot.entries.some(entry => entry.id === 'dsh-docker-control'), 'docker-control must be in the client graph');
            ensure(boot.entries.some(entry => entry.id === 'dsh-browser-panel'), 'the browser panel must be in the client graph');
            phase = 'core frontend assets';
            const entryScript = html.match(/<script\b[^>]*\btype="module"[^>]*\bsrc="([^"]+)"/i);
            ensure(entryScript, 'the core must serve its frontend entry');
            const assetUrl = new URL(entryScript[1], `${origin}/`);
            ensure(assetUrl.origin === origin && assetUrl.pathname.startsWith('/assets/'), 'the frontend asset must stay on the loopback core');
            const asset = await request(assetUrl, options);
            ensure(asset.status === 200 && /javascript/.test(asset.headers.get('content-type') ?? '') && (await asset.text()).length > 0, 'the frontend asset must be usable');
            const batch = Array.isArray(boot.batches) && boot.batches.find(row => Array.isArray(row.entries) && row.entries.includes('dsh-docker-control'));
            ensure(batch && typeof batch.url === 'string', 'the client graph must contain the plugin batch');
            const batchUrl = new URL(batch.url, `${origin}/`);
            ensure(batchUrl.origin === origin, 'the plugin batch must stay on the loopback core');
            const client = await request(batchUrl, options);
            ensure(client.status === 200 && /id:\s*['"]dsh-docker-control['"]/.test(await client.text()), 'the plugin client factory must be served');
            phase = 'docker-control core status';
            const status = await request(`${origin}/dsh-docker-control/status`, options);
            ensure(status.status === 200, 'the plugin must answer on the direct core listener');
            const body = await status.json();
            ensure(body.ok === true && typeof body.boot === 'string' && body.boot.length > 0, 'the plugin must return its real boot identity');
            phase = 'browser panel status';
            const panel = await request(`${origin}/dsh-browser-panel/status`, options);
            ensure(panel.status === 200, 'the browser panel must answer on the direct core listener');
            const panelBody = await panel.json();
            ensure(panelBody.state === 'stopped' && panelBody.ports?.rfb === 5900 && panelBody.ports?.cdp === 9222, 'the browser panel must report its idle state and ports');
            ensure(panelBody.novnc !== false, 'the image must ship noVNC');
            console.log('image health: Nginx 204; authenticated DSH index, boot graph, assets, docker-control status and browser panel status: ok');
          } catch {
            console.error(`image health not ready: ${phase}`);
            process.exitCode = 1;
          }
          NODE
          )"
          ready=false
          for ((attempt=1; attempt<=60; attempt+=1)); do
            [ "$(docker inspect --format '{{.State.Running}}' "$container")" = true ] || break
            if docker logs "$container" 2>&1 \
              | docker exec --interactive --env "DSH_CI_VERSION=$EXPECTED_VERSION" "$container" \
                node --input-type=module -e "$probe_js"; then
              ready=true
              break
            fi
            sleep 3
          done
          [ "$ready" = true ] || { echo 'Offline image health gate failed.' >&2; exit 1; }

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          printf '%s' '${{ steps.build.outputs.digest }}' > "/tmp/digests/${{ matrix.slug }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # dsh-<版本> 让包页面直接显示镜像里装的是哪个 DSH 版本。
          tags: |
            type=raw,value=latest
            type=raw,value=dsh-${{ needs.resolve.outputs.version }}
            type=raw,value={{date 'YYYYMMDD'}}-{{sha}}
            type=ref,event=tag

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -eu
          tags="$(jq -cr '.tags | map("--tag " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          sources=""
          for file in *; do
            sources="$sources ${REGISTRY}/${IMAGE_NAME}@$(cat "$file")"
          done
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags $sources

      - name: Inspect published manifest
        run: docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:latest"
