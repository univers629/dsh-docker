# Legacy compatibility overlay. The Linux runtime no longer includes this
 # file: Debian system state intentionally remains in the long-lived
 # container writable layer. Keep it only for older installations that still
 # reference it explicitly; do not add it to normal compose commands.
services:
  dsh:
    environment:
      DSH_SYSTEM_PACKAGES_PERSISTENT: "true"
    volumes:
      # These are Docker volumes backed by project-local host directories. The
      # Linux scripts seed each empty directory from the freshly built image
      # before the first mount. Debian 13 uses usr-merge, so /bin, /sbin, and
      # /lib resolve to these canonical /usr paths.
      - dsh-system-usr-bin:/usr/bin
      - dsh-system-usr-sbin:/usr/sbin
      - dsh-system-usr-lib:/usr/lib
      - dsh-system-usr-share:/usr/share
      - dsh-system-usr-include:/usr/include
      - dsh-system-usr-libexec:/usr/libexec
      - dsh-system-usr-games:/usr/games
      - dsh-system-usr-src:/usr/src
      - dsh-system-etc:/etc
      - dsh-system-var-lib:/var/lib
      - dsh-system-var-cache:/var/cache
      - dsh-system-var-backups:/var/backups

volumes:
  dsh-system-usr-bin:
    driver: local
    driver_opts: { type: none, o: bind, device: ./data/system/usr/bin }
  dsh-system-usr-sbin:
    driver: local
    driver_opts: { type: none, o: bind, device: ./data/system/usr/sbin }
  dsh-system-usr-lib:
    driver: local
    driver_opts: { type: none, o: bind, device: ./data/system/usr/lib }
  dsh-system-usr-share:
    driver: local
    driver_opts: { type: none, o: bind, device: ./data/system/usr/share }
  dsh-system-usr-include:
    driver: local
    driver_opts: { type: none, o: bind, device: ./data/system/usr/include }
  dsh-system-usr-libexec:
    driver: local
    driver_opts: { type: none, o: bind, device: ./data/system/usr/libexec }
  dsh-system-usr-games:
    driver: local
    driver_opts: { type: none, o: bind, device: ./data/system/usr/games }
  dsh-system-usr-src:
    driver: local
    driver_opts: { type: none, o: bind, device: ./data/system/usr/src }
  dsh-system-etc:
    driver: local
    driver_opts: { type: none, o: bind, device: ./data/system/etc }
  dsh-system-var-lib:
    driver: local
    driver_opts: { type: none, o: bind, device: ./data/system/var/lib }
  dsh-system-var-cache:
    driver: local
    driver_opts: { type: none, o: bind, device: ./data/system/var/cache }
  dsh-system-var-backups:
    driver: local
    driver_opts: { type: none, o: bind, device: ./data/system/var/backups }
