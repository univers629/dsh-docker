- id: webserver
  config:
    host: !!js ctx.webStartup.host ?? (process.env.DSH_WEB_HOST ?? '127.0.0.1')
    port: !!js ctx.webStartup.port ?? Number(process.env.DSH_WEB_PORT ?? 3081)

- id: web-runtime
  config:
    printUrl: true
    surfaceContext: true
    trustedHosts: !!js (process.env.DSH_TRUSTED_HOSTS ?? '').split(/\s*,\s*/).filter(Boolean).concat(ctx.webStartup.trustedHosts)