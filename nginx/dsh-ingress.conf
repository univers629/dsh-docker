# dsh-ingress：容器加固模式下的宿主入口。
#
# 加固后的 dsh 容器只挂 internal 网络：它既不能直接出网（出网走 dsh-egress 代理），
# 也没法自己发布端口。所以宿主的 3080 由这个独立的 Nginx 容器发布，再把 TCP 流原样
# 转给 dsh:3080。
#
# 这里必须是 stream 四层转发，不能做七层代理：dsh 容器里的 Nginx 继续负责 Basic
# Auth，以及把请求以回环身份呈现给 DSH 本体（Host/Origin 改写、剥离 X-Forwarded-*）。
# 一旦这里改 Host 头、拆包或补 X-Forwarded-*，那套同源与凭据边界就废了。
#
# Debian 把 stream 编译成动态模块（--with-stream=dynamic），模块清单由 nginx 包
# 维护；官方 nginx 镜像里 stream 是静态编译的，这个通配 include 匹配不到文件也不
# 会报错。
include /etc/nginx/modules-enabled/*.conf;

# 3080 是非特权端口，所以 dsh-ingress 容器整个跑在 UID 1000 上（cap_drop: ALL，
# 连 root 都不留）。这条 user 指令因此只是一道保险：真有人以 root 跑这份配置时，
# worker 也必须降到 dsh 账户；容器里以非 root 启动时 Nginx 只会留一条可忽略的
# `the "user" directive makes sense only if the master process runs with
# super-user privileges` warn。
user dsh;
worker_processes 1;
# 容器里由 PID 1 直接管这个进程，不能后台化，否则容器起来就退了。
daemon off;
pid /tmp/nginx-ingress.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

stream {
    # Docker 内嵌 DNS。dsh 容器重启后 IP 会变，所以显式配 resolver 并给一个短 TTL；
    # 容器网络里没有 IPv6，关掉 AAAA 省一次无用查询。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # 用变量做 proxy_pass 是重点：字面量形式只在启动时解析一次，dsh 容器换 IP 后
    # 会一直连旧地址；变量形式每条新连接都走 resolver，重启后自动跟上。
    #
    # 上游名字刻意不用 `dsh`：这个容器在 dsh-private 网络上顶着 network alias `dsh`
    # （为了让 DPanel 那种把上游写成 http://dsh:3080 的反代不用改配置），而 Docker
    # 内嵌 DNS 会把自己的 alias 也算进解析结果，实测 `dsh` 会解析到本容器自己造成自连
    # （connect() to <自己>:3080 failed）。所以 dsh 服务在 dsh-internal 上另外挂了一个
    # 专用别名 dsh-app，只有它能无歧义地指向 DSH 本体。
    map $server_port $dsh_upstream {
        default dsh-app:3080;
    }

    server {
        listen 3080;

        # 只转发字节流：不解析 HTTP，不改 Host 头，不做 TLS 终止。
        proxy_pass $dsh_upstream;
        proxy_connect_timeout 5s;
        # WebUI 有长连接（终端 / SSE），空闲超时要跟 dsh 容器里的 3600s 对齐。
        proxy_timeout 3600s;
        proxy_socket_keepalive on;
    }
}
