# dsh-authgate：单管理员模式的入口（七层）。
#
# 与多用户入口的区别只有上游：这里只有一个固定上游（dsh 本体），不按会话身份分流。
# 认证同样交给 dsh-auth 网关，容器内 Nginx 不做认证（DSH_ACCESS_MODE=password）。
#
# 没有这一层，password 模式就是「容器内不做认证」且外面也没有认证——门户大开。
# 因此 password 与这个叠加层必须同时出现。

include /etc/nginx/modules-enabled/*.conf;

user dsh;
worker_processes auto;
# 容器 fd 软上限默认 1024，与 worker_connections 同量级，连接一多即 accept4() 失败。
worker_rlimit_nofile 65536;
daemon off;
pid /tmp/nginx-authgate.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    # nginx 默认 8×8k；上游反代或 CDN 追加的头加上会话 Cookie 会越过它，
    # 越界即 400 Request Header Or Cookie Too Large。
    client_header_buffer_size 8k;
    large_client_header_buffers 4 32k;

    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    client_max_body_size 64m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    limit_req_zone $binary_remote_addr zone=dsh_auth_zone:10m rate=120r/m;
    limit_req_status 429;

    server {
        listen 3080;

        # 变量上游：字面量 upstream 会在启动时解析域名，网关没起来入口就起不来。
        set $dsh_app "http://dsh:3080";
        set $dsh_auth "http://dsh-auth:8091";

        # 入口↔网关共享密钥：由容器启动命令从 DSH_AUTH_INGRESS_TOKEN 生成（与
        # 多用户入口同一份文件 /tmp/dsh-nginx/ingress-token.conf），verify 子请求
        # 把它带给网关做进程侧校验——internal 之外还需要一道进程内的对端校验。
        include /tmp/dsh-nginx/ingress-token.conf;

        # 重定向用相对地址：对外端口可能与容器内不同，也可能在 TLS 终止之后。
        absolute_redirect off;

        error_page 429 = @throttled;

        location = /healthz {
            access_log off;
            return 204;
        }

        location = /__dsh_auth/verify {
            internal;
            proxy_pass $dsh_auth/__dsh_auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
            proxy_set_header X-DSH-Ingress-Token $dsh_ingress_token;
        }

        # 网关自己的页面、接口与静态资源（必须显式归口，否则会落到 dsh 本体上）。
        location ~ ^/(app\.css|backdrop\.js|account-panel\.js)$ {
            proxy_pass $dsh_auth;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/(login|waking|account)$ {
            limit_req zone=dsh_auth_zone burst=20 nodelay;
            proxy_pass $dsh_auth;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 提交凭据的接口：限速（粗粒度防爆破；细粒度在应用层的 IP+账户双桶锁上）
        location ~ ^/api/auth/(login|register|password|totp/|passkey/) {
            limit_req zone=dsh_auth_zone burst=20 nodelay;
            proxy_pass $dsh_auth;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 只读接口：不限速。账户面板一次打开就会并发读取会话/通行密钥/状态，
        # 把读也计入额度会让正常使用直接撞 429。
        location /api/auth/ {
            proxy_pass $dsh_auth;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 注册与管理面在单管理员模式下不存在，直接拒绝，避免误以为可用。
        location ~ ^/(register|admin)$ {
            return 404;
        }
        location ^~ /api/admin/ {
            return 404;
        }

        location = /manifest.webmanifest {
            auth_request off;
            alias /usr/local/share/dsh-pwa/manifest.webmanifest;
            default_type application/manifest+json;
            add_header Cache-Control "no-cache";
        }

        location = /service-worker.js {
            auth_request off;
            alias /usr/local/share/dsh-pwa/service-worker.js;
            default_type application/javascript;
            add_header Cache-Control "no-cache";
        }

        location = /pwa-register.js {
            auth_request off;
            alias /usr/local/share/dsh-pwa/pwa-register.js;
            default_type application/javascript;
            add_header Cache-Control "public, max-age=3600";
        }

        location ~ ^/(favicon\.svg|icon-192\.png|icon-512\.png|icon-maskable-512\.png)$ {
            auth_request off;
            alias /usr/local/share/dsh-pwa/$1;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # 撞到限速时不要给 nginx 的裸错误页：带 Retry-After 并自动重试一次，
        # 这样「一时点太快」不会变成用户必须自己刷新才能恢复的死状态。
        location @throttled {
            default_type text/html;
            add_header Retry-After 10 always;
            add_header Cache-Control "no-store" always;
            return 429 '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="10"><title>请求过于频繁</title><body style="font-family:system-ui;background:#0f1115;color:#e6ebf5;display:grid;place-items:center;height:100vh;margin:0"><div style="text-align:center"><div style="font-size:15px;margin-bottom:6px">请求过于频繁</div><div style="font-size:12.5px;color:#8b96ab">页面会在 10 秒后自动重试，无需手动刷新</div></div></body>';
        }

        location @to_login {
            return 302 /login?redirect=$request_uri;
        }

        location / {
            auth_request /__dsh_auth/verify;
            error_page 401 = @to_login;
            # dsh 本体重启期间会短暂不可达；用 503 让浏览器自己重试，而不是把原始错误页给用户。
            error_page 502 503 504 = @unavailable;
            # 拦截上游错误，否则上游返回的 5xx 会被原样透传，error_page 不生效。
            proxy_intercept_errors on;

            proxy_pass $dsh_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # dsh 本体不可达时的过渡页：带自动刷新，用户不需要手动刷。
        location @unavailable {
            default_type text/html;
            add_header Retry-After 5 always;
            add_header Cache-Control "no-store" always;
            return 503 '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="5"><title>正在启动</title><body style="font-family:system-ui;background:#0f1115;color:#e6ebf5;display:grid;place-items:center;height:100vh;margin:0"><div style="text-align:center"><div style="font-size:15px;margin-bottom:6px">服务正在启动</div><div style="font-size:12.5px;color:#8b96ab">页面会自动重试，无需手动刷新</div></div></body>';
        }
    }
}
