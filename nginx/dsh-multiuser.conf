# dsh-multiuser：多用户模式的宿主入口（七层）。
#
# 与单用户模式的两点结构性差别：
#   1. 认证不再由 nginx 的 Basic Auth 承担，而是交给 dsh-auth 网关：登录、注册、
#      实例唤醒界面都是它的页面，其余请求通过 auth_request 判定。
#   2. 上游不再固定，而是按会话身份选择——auth_request 的响应头 X-DSH-Instance 决定
#      这个请求该进哪个用户实例。变量形式的 proxy_pass 配合 Docker 内嵌 DNS 解析容器名。
#
# 用户实例本身不发布任何宿主端口，只在 dsh-instances-net 专用网络内可达（成员：
# 用户实例、本入口、密钥代理），与管理员工作台/认证网关所在的 dsh-private 物理隔离；
# 本文件是唯一入口。

include /etc/nginx/modules-enabled/*.conf;

user dsh;
worker_processes auto;
daemon off;
pid /tmp/nginx-multiuser.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    # nginx 默认 8×8k；上游反代或 CDN 追加的头加上会话 Cookie 与 DSH 客户端
    # 那条长 /plugins/?? URL 会越过它，越界即 400 Request Header Or Cookie Too Large。
    client_header_buffer_size 8k;
    large_client_header_buffers 4 32k;

    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    # 登录与注册的请求体很小；工作台的文件上传走同一条入口，因此给足额度。
    client_max_body_size 64m;
    # 唤醒一个闲置实例可能需要数十秒，但等待由页面轮询承担，代理本身不需要长超时。
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Docker 内嵌 DNS：实例的 IP 会随重建变化，变量形式的 proxy_pass 每次新连接
    # 都会重新解析，容器重建后自动跟上。容器网络里没有 IPv6，关掉 AAAA 省一次查询。
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 公网暴露面限流：认证接口单独收紧，防止有人把登录页当靶子刷。
    limit_req_zone $binary_remote_addr zone=dsh_auth_zone:10m rate=120r/m;
    limit_req_status 429;

    server {
        listen 3080;

        # 认证网关用变量上游：字面量 upstream 会在启动时解析域名，dsh-auth 尚未就绪就会让
        # 入口直接起不来（同样的坑在 dsh-ingress.conf 里已经吃过一次）。变量形式每条新连接
        # 都走 resolver，网关重启或换 IP 都能自动跟上。`set` 只允许出现在 server/location
        # 上下文，因此放在 server 块内。
        set $dsh_auth "http://dsh-auth:8091";

        # 入口↔网关共享密钥：由容器启动命令从 DSH_AUTH_INGRESS_TOKEN 生成到
        # /tmp/dsh-nginx/ingress-token.conf（内容是 set $dsh_ingress_token "...";），
        # 避免把密钥写进版本库里的这份配置。verify 子请求把它带给网关做进程侧校验。
        include /tmp/dsh-nginx/ingress-token.conf;

        # 重定向一律用相对地址：入口在容器内监听 3080，但对外可能是别的端口、并且在
        # TLS 终止之后。nginx 默认会把 Location 补成绝对地址并带上内部端口，那会把
        # 用户带到 http://<域名>:3080/... 这种打不开的地址。
        absolute_redirect off;

        error_page 429 = @throttled;

        location = /healthz {
            access_log off;
            return 204;
        }

        # 认证判定端点：只允许内部子请求访问，外部直接访问一律 404。
        # internal 只是 nginx 侧的约束；进程侧还要校验入口共享密钥（下方
        # $dsh_ingress_token 由入口启动时从环境变量生成，见 compose 的 command），
        # 否则任何能直连网关端口的网络成员都能凭会话 Cookie 换出身份头。
        location = /__dsh_auth/verify {
            internal;
            proxy_pass $dsh_auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
            proxy_set_header X-DSH-Ingress-Token $dsh_ingress_token;
        }

        # 认证网关自己的页面、接口与静态资源。
        # 这些路径必须显式归口到网关：`location /` 会把未匹配的请求按会话身份转发到用户
        # 实例，于是登录页引用的 /app.css 与 /backdrop.js 会落到实例上（未登录时被
        # auth_request 拦下 → 重定向回 /login → 打不开登录页），管理面板与管理接口也会
        # 落到实例上。正则 location 优先于前缀 location，因此这些规则先于 `location /` 生效。

        # 网关的静态资源：不加限速（每次打开页面都会拉）。
        location ~ ^/(app\.css|backdrop\.js|account-panel\.js)$ {
            proxy_pass $dsh_auth;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 登录、注册与实例唤醒界面。
        location ~ ^/(login|register|waking|account)$ {
            limit_req zone=dsh_auth_zone burst=40 nodelay;
            proxy_pass $dsh_auth;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 管理面板页面：仅初始管理员可用，网关按角色判定。
        location ~ ^/admin(/|$) {
            proxy_pass $dsh_auth;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 提交凭据的接口：限速（粗粒度防爆破；细粒度在应用层的 IP+账户双桶锁上）
        location ~ ^/api/auth/(login|register|password|totp/|passkey/) {
            limit_req zone=dsh_auth_zone burst=20 nodelay;
            proxy_pass $dsh_auth;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 只读接口：不限速。账户面板一次打开就会并发读取会话/通行密钥/状态，
        # 把读也计入额度会让正常使用直接撞 429。
        location /api/auth/ {
            proxy_pass $dsh_auth;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /api/admin/ {
            limit_req zone=dsh_auth_zone burst=30 nodelay;
            proxy_pass $dsh_auth;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # PWA 元数据与图标不含私有数据，保持免认证，否则后台清单与 Service Worker 拉取会被拦。
        location = /manifest.webmanifest {
            auth_request off;
            alias /usr/local/share/dsh-pwa/manifest.webmanifest;
            default_type application/manifest+json;
            add_header Cache-Control "no-cache";
        }

        location = /service-worker.js {
            auth_request off;
            alias /usr/local/share/dsh-pwa/service-worker.js;
            default_type application/javascript;
            add_header Cache-Control "no-cache";
        }

        location = /pwa-register.js {
            auth_request off;
            alias /usr/local/share/dsh-pwa/pwa-register.js;
            default_type application/javascript;
            add_header Cache-Control "public, max-age=3600";
        }

        location ~ ^/(favicon\.svg|icon-192\.png|icon-512\.png|icon-maskable-512\.png)$ {
            auth_request off;
            alias /usr/local/share/dsh-pwa/$1;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # 撞到限速时不要给 nginx 的裸错误页：带 Retry-After 并自动重试一次，
        # 这样「一时点太快」不会变成用户必须自己刷新才能恢复的死状态。
        location @throttled {
            default_type text/html;
            add_header Retry-After 10 always;
            add_header Cache-Control "no-store" always;
            return 429 '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="10"><title>请求过于频繁</title><body style="font-family:system-ui;background:#0f1115;color:#e6ebf5;display:grid;place-items:center;height:100vh;margin:0"><div style="text-align:center"><div style="font-size:15px;margin-bottom:6px">请求过于频繁</div><div style="font-size:12.5px;color:#8b96ab">页面会在 10 秒后自动重试，无需手动刷新</div></div></body>';
        }

        # 未登录（verify 返回 401）时带着原地址去登录页，登录后回到用户本来要访问的位置。
        location @to_login {
            return 302 /login?redirect=$request_uri;
        }

        # 实例已被闲置回收（上游不可达）时转到唤醒界面，由页面轮询等待就绪。
        location @to_waking {
            return 302 /waking?redirect=$request_uri;
        }

        location / {
            auth_request /__dsh_auth/verify;
            # verify 的响应头即路由依据：用户实例名由认证网关按会话身份给出。
            auth_request_set $dsh_instance $upstream_http_x_dsh_instance;
            auth_request_set $dsh_user $upstream_http_x_dsh_user;
            auth_request_set $dsh_role $upstream_http_x_dsh_role;

            error_page 401 = @to_login;
            error_page 502 503 504 = @to_waking;
            # 必须开启：nginx 默认只对自己产生的错误页生效，上游（用户实例的 nginx）
            # 返回的 502 会被原样透传给浏览器。实例刚拉起时 DSH 还没监听 3081，实例
            # nginx 正是以 502 响应——关着它，用户看到的就是 nginx 的原始 502，
            # 而不是唤醒等待页。
            proxy_intercept_errors on;

            # 变量形式的上游：每次连接都按 Docker DNS 重新解析实例地址。
            proxy_pass http://$dsh_instance:3080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 身份随请求带入实例，供实例内的 DSH 与插件读取（不用于鉴权决策）。
            proxy_set_header X-DSH-User $dsh_user;
            proxy_set_header X-DSH-Role $dsh_role;
            proxy_buffering off;
        }
    }
}
