worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_max_body_size 0;
    access_log off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_vary on;
    gzip_proxied any;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 3080;

        location / {
            proxy_pass http://127.0.0.1:3081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # The outer reverse proxy is the authentication boundary. Once a
            # request reaches this private bridge, present it to the official
            # DSH server as loopback so its host-only settings and credential
            # APIs keep their documented security behavior.
            proxy_set_header Host 127.0.0.1:3081;
            proxy_set_header Origin http://127.0.0.1:3081;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Set-Cookie "DSH_PUBLIC_LOCAL_MODE=1; Path=/; Secure; SameSite=Lax" always;
            proxy_read_timeout 3600s;
        }
    }
}
