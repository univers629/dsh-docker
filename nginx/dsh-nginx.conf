# 主进程仍是 root（Supervisor 需要它管理生命周期），worker 降到非特权账户。
user dsh;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_max_body_size 0;
    access_log off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_vary on;
    gzip_proxied any;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # 破坏性操作的限流区。
    #
    # 只挂在「点一下就会改动容器状态」的写接口上：重启、更新、改配置。这些接口正常人
    # 一天也用不了几次，而它们每一个都能把服务推进 502（重启风暴、装进起不来的新版本、
    # 改坏配置文件），所以限流挡的是「反复点」，不是「点得对不对」。
    #
    # 必须避开所有被轮询的读接口：/metrics 每 2 秒采一次、/update/status 每 1 秒轮询
    # 一次，一旦把它们算进同一个桶，正常打开页面就会立刻被限死。所以下面按读写分成
    # 两组 location，读组完全不限。
    #
    # 用 $binary_remote_addr 而不是 $server_name：反代后面所有请求都来自同一个上游
    # 地址，按 IP 分桶相当于全局限流 —— 单个用户反复点不会误伤别人，这正是想要的。
    #
    # 限流键要按方法区分：/dsh-docker-control/config 同时支持 GET（读配置）和 PUT
    # （写配置），而 limit_req 只看 location、不看方法，直接挂上去会把前端的正常读取
    # 也一起限掉。而 limit_except 块里不允许出现 limit_req，没法在那里表达「只限
    # PUT」。所以改用一个 map：读请求映射成空键，空键不参与限流计数，写请求才落到
    # 客户端 IP 这个桶里。
    map $request_method $dsh_write_key {
        default $binary_remote_addr;
        GET     '';
        HEAD    '';
        OPTIONS '';
    }

    limit_req_zone $dsh_write_key zone=dsh_destructive:1m rate=6r/m;
    # 限流命中时返回 429 而不是默认的 503：503 会被误读成「服务挂了」，429 才说明
    # 「你点得太快」，前端和运维都不会把它当成容器故障。
    limit_req_status 429;
    # 把被拒绝的请求记下来，方便事后确认是谁在刷。
    limit_req_log_level warn;

    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 3080;

        # Generated by the container entrypoint. It is either `auth_basic off`
        # or a Basic Auth policy backed by the runtime copy of the mounted
        # /opt/dsh-auth/htpasswd file.
        include /tmp/dsh-auth.conf;

        location = /healthz {
            auth_basic off;
            access_log off;
            return 204;
        }

        # Installable PWA metadata and official DSH artwork contain no private
        # data. Keep them readable without Basic Auth so background manifest
        # and Service Worker fetches can pass; the app HTML and APIs stay protected.
        location = /manifest.webmanifest {
            auth_basic off;
            alias /usr/local/share/dsh-pwa/manifest.webmanifest;
            default_type application/manifest+json;
            add_header Cache-Control "no-cache";
        }

        location = /service-worker.js {
            auth_basic off;
            alias /usr/local/share/dsh-pwa/service-worker.js;
            default_type application/javascript;
            add_header Cache-Control "no-cache";
        }

        location = /pwa-register.js {
            auth_basic off;
            alias /usr/local/share/dsh-pwa/pwa-register.js;
            default_type application/javascript;
            add_header Cache-Control "public, max-age=3600";
        }

        location ~ ^/(favicon\.svg|icon-192\.png|icon-512\.png|icon-maskable-512\.png)$ {
            auth_basic off;
            alias /usr/local/share/dsh-pwa/$1;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # The market's self-restart guard deliberately rejects forwarded
        # requests. This route is protected either here by Basic Auth or by
        # the selected trusted outer proxy. Present it to the loopback listener
        # without proxy-chain headers so the same-origin check can pass.
        #
        # 挂破坏性操作限流：反复触发重启会让页面反复断开，每次都撞进 supervisor 的
        # 退避窗口，表现就是持续 502。正常人点一次就够，burst=2 还留了连点的余地。
        location = /dsh-market/restart {
            limit_req zone=dsh_destructive burst=2 nodelay;
            proxy_pass http://127.0.0.1:3081;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:3081;
            proxy_set_header Origin http://127.0.0.1:3081;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            add_header Set-Cookie "DSH_PUBLIC_LOCAL_MODE=1; Path=/; Secure; SameSite=Lax" always;
            proxy_read_timeout 60s;
        }

        # 与 /dsh-market/restart 同源，同样是写接口，同样挂破坏性操作限流。
        location = /dsh-docker-control/restart {
            limit_req zone=dsh_destructive burst=2 nodelay;
            proxy_pass http://127.0.0.1:3081;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:3081;
            proxy_set_header Origin http://127.0.0.1:3081;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            add_header Set-Cookie "DSH_PUBLIC_LOCAL_MODE=1; Path=/; Secure; SameSite=Lax" always;
            proxy_read_timeout 60s;
        }

        # DSH version information, the sidebar's container metrics and the
        # in-container updater use the same authenticated loopback boundary as
        # the config and restart routes. Paths only reachable through this
        # boundary have to be listed here: everything else falls through to
        # `location /`, which keeps X-Forwarded-For and is therefore refused.
        #
        # 只读组：这些路径会被前端高频轮询（/metrics 每 2 秒、/update/status 每 1 秒），
        # 所以刻意不加任何 limit_req。一旦把它们和写接口放进同一个桶，正常打开页面就
        # 会立刻触发限流。
        location ~ ^/dsh-docker-control/(info|metrics|update/status|update/latest)$ {
            proxy_pass http://127.0.0.1:3081;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:3081;
            proxy_set_header Origin http://127.0.0.1:3081;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            add_header Set-Cookie "DSH_PUBLIC_LOCAL_MODE=1; Path=/; Secure; SameSite=Lax" always;
            proxy_read_timeout 60s;
        }

        # DSH 本体的更新触发。这是一个写接口，正常只在人点「更新」时调一次，所以单独
        # 列出来并挂上破坏性操作限流：反复触发会把 /app/dsh 换成起不来的版本，容器重启
        # 也清不掉，页面持续 502。注意必须写在上面那条只读正则之后 —— Nginx 的 regex
        # location 按出现顺序匹配，反过来会把 update/status 也一起限掉。
        location = /dsh-docker-control/update {
            limit_req zone=dsh_destructive burst=2 nodelay;
            proxy_pass http://127.0.0.1:3081;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:3081;
            proxy_set_header Origin http://127.0.0.1:3081;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            add_header Set-Cookie "DSH_PUBLIC_LOCAL_MODE=1; Path=/; Secure; SameSite=Lax" always;
            proxy_read_timeout 60s;
        }

        # The WebUI configuration editor is intentionally pathless and fixed
        # to DSH_HOME/settings.yaml. Strip public proxy-chain headers exactly
        # like the restart endpoint so the host plugin can enforce its
        # authenticated loopback boundary for both reads and writes.
        #
        # 这个接口同时支持 GET（读配置）和 PUT（写配置）。限流本身不区分方法，靠上面
        # 的 $dsh_write_key 把 GET/HEAD/OPTIONS 映射成空键来跳过计数，所以这里可以放心
        # 直接挂 limit_req：读永远畅通，只有真正改写 settings.yaml 的请求才受限。
        location = /dsh-docker-control/config {
            limit_req zone=dsh_destructive burst=2 nodelay;
            client_max_body_size 7m;
            proxy_pass http://127.0.0.1:3081;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:3081;
            proxy_set_header Origin http://127.0.0.1:3081;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            add_header Set-Cookie "DSH_PUBLIC_LOCAL_MODE=1; Path=/; Secure; SameSite=Lax" always;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://127.0.0.1:3081;
            proxy_http_version 1.1;
            # Upstream already links a manifest and favicon. Replace the
            # manifest at this proxy and inject only the missing PWA lifecycle
            # metadata into HTML responses. Disabling upstream compression is
            # required for Nginx's response filter to see the HTML body.
            proxy_set_header Accept-Encoding "";
            sub_filter_once on;
            sub_filter '<link rel="manifest" href="/manifest.webmanifest" />' '<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />';
            sub_filter '</head>' '<meta name="theme-color" content="#ffffff"><link rel="apple-touch-icon" href="/icon-192.png"><script src="/pwa-register.js" defer></script></head>';
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Authentication is enforced either by this server's Basic Auth or
            # by the selected trusted outer proxy. Once a request reaches this
            # private bridge, present it to the official
            # DSH server as loopback so its host-only settings and credential
            # APIs keep their documented security behavior.
            proxy_set_header Host 127.0.0.1:3081;
            proxy_set_header Origin http://127.0.0.1:3081;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-DSH-Trusted-Proxy 1;
            add_header Set-Cookie "DSH_PUBLIC_LOCAL_MODE=1; Path=/; Secure; SameSite=Lax" always;
            proxy_read_timeout 3600s;
        }
    }
}
