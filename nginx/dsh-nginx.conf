# 主进程仍是 root（Supervisor 需要它管理生命周期），worker 降到非特权账户。
user dsh;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_max_body_size 0;
    access_log off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_vary on;
    gzip_proxied any;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 3080;

        # Generated by the container entrypoint. It is either `auth_basic off`
        # or a Basic Auth policy backed by the runtime copy of the mounted
        # /opt/dsh-auth/htpasswd file.
        include /tmp/dsh-auth.conf;

        location = /healthz {
            auth_basic off;
            access_log off;
            return 204;
        }

        # Installable PWA metadata and official DSH artwork contain no private
        # data. Keep them readable without Basic Auth so background manifest
        # and Service Worker fetches can pass; the app HTML and APIs stay protected.
        location = /manifest.webmanifest {
            auth_basic off;
            alias /usr/local/share/dsh-pwa/manifest.webmanifest;
            default_type application/manifest+json;
            add_header Cache-Control "no-cache";
        }

        location = /service-worker.js {
            auth_basic off;
            alias /usr/local/share/dsh-pwa/service-worker.js;
            default_type application/javascript;
            add_header Cache-Control "no-cache";
        }

        location = /pwa-register.js {
            auth_basic off;
            alias /usr/local/share/dsh-pwa/pwa-register.js;
            default_type application/javascript;
            add_header Cache-Control "public, max-age=3600";
        }

        location ~ ^/(favicon\.svg|icon-192\.png|icon-512\.png|icon-maskable-512\.png)$ {
            auth_basic off;
            alias /usr/local/share/dsh-pwa/$1;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # The market's self-restart guard deliberately rejects forwarded
        # requests. This route is protected either here by Basic Auth or by
        # the selected trusted outer proxy. Present it to the loopback listener
        # without proxy-chain headers so the same-origin check can pass.
        location = /dsh-market/restart {
            proxy_pass http://127.0.0.1:3081;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:3081;
            proxy_set_header Origin http://127.0.0.1:3081;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            add_header Set-Cookie "DSH_PUBLIC_LOCAL_MODE=1; Path=/; Secure; SameSite=Lax" always;
            proxy_read_timeout 60s;
        }

        location = /dsh-docker-control/restart {
            proxy_pass http://127.0.0.1:3081;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:3081;
            proxy_set_header Origin http://127.0.0.1:3081;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            add_header Set-Cookie "DSH_PUBLIC_LOCAL_MODE=1; Path=/; Secure; SameSite=Lax" always;
            proxy_read_timeout 60s;
        }

        # The WebUI configuration editor is intentionally pathless and fixed
        # to DSH_HOME/settings.yaml. Strip public proxy-chain headers exactly
        # like the restart endpoint so the host plugin can enforce its
        # authenticated loopback boundary for both reads and writes.
        location = /dsh-docker-control/config {
            client_max_body_size 7m;
            proxy_pass http://127.0.0.1:3081;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:3081;
            proxy_set_header Origin http://127.0.0.1:3081;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            add_header Set-Cookie "DSH_PUBLIC_LOCAL_MODE=1; Path=/; Secure; SameSite=Lax" always;
            proxy_read_timeout 60s;
        }

        # DSH version information and the in-container updater use the same
        # authenticated loopback boundary as the config and restart routes.
        location ~ ^/dsh-docker-control/(info|update|update/status|update/latest)$ {
            proxy_pass http://127.0.0.1:3081;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:3081;
            proxy_set_header Origin http://127.0.0.1:3081;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            add_header Set-Cookie "DSH_PUBLIC_LOCAL_MODE=1; Path=/; Secure; SameSite=Lax" always;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://127.0.0.1:3081;
            proxy_http_version 1.1;
            # Upstream already links a manifest and favicon. Replace the
            # manifest at this proxy and inject only the missing PWA lifecycle
            # metadata into HTML responses. Disabling upstream compression is
            # required for Nginx's response filter to see the HTML body.
            proxy_set_header Accept-Encoding "";
            sub_filter_once on;
            sub_filter '<link rel="manifest" href="/manifest.webmanifest" />' '<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />';
            sub_filter '</head>' '<meta name="theme-color" content="#ffffff"><link rel="apple-touch-icon" href="/icon-192.png"><script src="/pwa-register.js" defer></script></head>';
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Authentication is enforced either by this server's Basic Auth or
            # by the selected trusted outer proxy. Once a request reaches this
            # private bridge, present it to the official
            # DSH server as loopback so its host-only settings and credential
            # APIs keep their documented security behavior.
            proxy_set_header Host 127.0.0.1:3081;
            proxy_set_header Origin http://127.0.0.1:3081;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-DSH-Trusted-Proxy 1;
            add_header Set-Cookie "DSH_PUBLIC_LOCAL_MODE=1; Path=/; Secure; SameSite=Lax" always;
            proxy_read_timeout 3600s;
        }
    }
}
